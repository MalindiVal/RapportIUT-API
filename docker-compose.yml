services:
  api:
    container_name: api
    build:
      context: ./Serveur/API
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://*:8080"
    volumes:
      - ./Serveur/RapportsUploader:/app/RapportsUploader
