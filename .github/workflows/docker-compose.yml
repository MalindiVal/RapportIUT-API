version: "3.9"

services:
  api:
    container_name: api
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "https://*:8081;http://*:8080"
    restart: unless-stopped
